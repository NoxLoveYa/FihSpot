services:
  db:
    image: postgres:16-alpine
    container_name: fihspot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fihspot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fihspot}
      POSTGRES_DB: ${POSTGRES_DB:-fihspot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fihspot"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: fihspot-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fihspot}:${POSTGRES_PASSWORD:-fihspot}@db:5432/${POSTGRES_DB:-fihspot}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in .env}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-https://fihspot.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    volumes:
      - ./server/uploads:/app/server/uploads
      - scan_cache:/app/server/cache

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    container_name: fihspot-client
    restart: unless-stopped
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    container_name: fihspot-caddy
    restart: unless-stopped
    depends_on:
      - client
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  scan_cache:
